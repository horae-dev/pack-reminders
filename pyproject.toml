[project]
name = "horae-pack-reminders"
version = "0.1.1"
description = "Horae pipeline pack: reminders, a morning digest and overdue nudges from the vault, without an LLM."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.12"
# A pack ships data files (plugin.yaml, pipelines/), not Python code: there is
# nothing to build or install. The Python environment only exists to check those files
# with the core's own loaders, CLI and test helpers.
dependencies = []

[dependency-groups]
dev = [
    "horae",
    "horae-plugin-obsidian",
    "mypy>=2.4",
    "pre-commit>=4.7",
    "pytest>=9.1",
    "ruff>=0.17",
    "types-pyyaml>=6",
]

# horae and plugin-obsidian are not on PyPI yet: they come from the main branches of their
# repositories. uv.lock pins the exact commits (CI checks the lock, so checks are reproducible);
# Renovate's weekly lock file maintenance moves them to the latest main, or run
# `uv lock --upgrade-package horae --upgrade-package horae-plugin-obsidian`. plugin-obsidian is
# here so the tests run the real `obsidian.open_tasks` parser over a fixture vault and the real
# `obsidian.reminders` transform, with its golden vectors. horae-sdk, their dependency, comes
# from PyPI.
[tool.uv.sources]
horae = { git = "https://github.com/horae-dev/horae", branch = "main" }
horae-plugin-obsidian = { git = "https://github.com/horae-dev/plugin-obsidian", branch = "main" }

[tool.uv]
package = false
required-version = ">=0.13"
# No exclude-newer here: the 7-day cooldown on new releases is Renovate's minimumReleaseAge
# (renovate.json), as in the plugins, where `horae plugin add` runs `uv sync --locked
# --no-config` and would not match a lock resolved with it. `package = false`: the
# environment is a dev-only virtual project, the pack itself is never installed through uv.

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "S", "PT"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]

[tool.mypy]
strict = true
files = ["tests"]
mypy_path = "tests"
python_version = "3.12"
warn_unreachable = true
enable_error_code = ["ignore-without-code", "redundant-expr", "truthy-bool"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]
addopts = "-ra --strict-config --strict-markers"
xfail_strict = true
filterwarnings = ["error"]
