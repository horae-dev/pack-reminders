[project]
name = "horae-pack-reminders"
version = "0.1.0"
description = "Horae pipeline pack: reminders, a morning digest and overdue nudges from the vault, without an LLM."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.12"
# A pack ships data files (plugin.yaml, pipelines/), not Python code: there is
# nothing to build or install. The Python environment only exists to check those files
# with the core's own loaders, CLI and test helpers.
dependencies = []

[dependency-groups]
dev = [
    "horae",
    "horae-plugin-obsidian",
    "mypy>=2.4",
    "pre-commit>=4.7",
    "pytest>=9.1",
    "ruff>=0.17",
    "types-pyyaml>=6",
]

# horae, horae-sdk and plugin-obsidian are not on PyPI yet: they come from the main branches of
# their repositories. uv.lock pins the exact commits (CI checks the lock, so checks are
# reproducible); Renovate's weekly lock file maintenance moves them to the latest main, or run
# `uv lock --upgrade-package horae --upgrade-package horae-sdk --upgrade-package
# horae-plugin-obsidian`. plugin-obsidian is here so the tests run the real `obsidian.open_tasks`
# parser over a fixture vault and the real `obsidian.reminders` transform, with its golden vectors;
# horae-sdk is its dependency, which uv takes from the core repository like the plugin does.
[tool.uv.sources]
# TEMPORARY pins to the unmerged fix branches (horae#145, plugin-obsidian#14): back to
# `branch = "main"` once both are merged.
horae = { git = "https://github.com/horae-dev/horae", rev = "be93437c83bed2dbcc1b4eb90eb3b044ee985568" }
horae-sdk = { git = "https://github.com/horae-dev/horae", rev = "be93437c83bed2dbcc1b4eb90eb3b044ee985568", subdirectory = "sdk" }
horae-plugin-obsidian = { git = "https://github.com/horae-dev/plugin-obsidian", rev = "7804e0827497f4cb0ec1b62cb627e262126917ad" }

[tool.uv]
package = false
required-version = ">=0.13"
exclude-newer = "7 days"

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "S", "PT"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]

[tool.mypy]
strict = true
files = ["tests"]
mypy_path = "tests"
python_version = "3.12"
warn_unreachable = true
enable_error_code = ["ignore-without-code", "redundant-expr", "truthy-bool"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]
addopts = "-ra --strict-config --strict-markers"
xfail_strict = true
filterwarnings = ["error"]
